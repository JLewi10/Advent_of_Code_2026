<calcite-shell>
  <calcite-navigation slot="header">
    <calcite-navigation-logo
      slot="logo"
      heading="Advent of Code"
      [description]="selectedYear() + ' Progress Tracker'"
      icon="package"
    ></calcite-navigation-logo>
    <calcite-button
      id="year-picker-trigger"
      slot="content-end"
      appearance="transparent"
      icon-end="chevron-down"
      aria-label="Select Advent of Code year"
    >
      {{ selectedYear() }}
    </calcite-button>
    <calcite-dropdown
      slot="content-end"
      reference-element="year-picker-trigger"
      placement="bottom-end"
    >
      <calcite-dropdown-group group-title="Advent of Code year" selection-mode="single">
        @for (year of yearOptions; track year) {
          <calcite-dropdown-item
            [selected]="year === selectedYear()"
            (calciteDropdownItemSelect)="selectYear(year)"
          >
            {{ year }}
          </calcite-dropdown-item>
        }
      </calcite-dropdown-group>
    </calcite-dropdown>
    @if (!isDashboard()) {
      <calcite-menu slot="content-end">
        <calcite-menu-item
          [routerLink]="['/']"
          text="Return to dashboard"
          icon-start="home"
        ></calcite-menu-item>
      </calcite-menu>
    }
    <calcite-navigation-user
      slot="user"
      full-name="Jason Lewis"
      username="JLewi10"
    ></calcite-navigation-user>
    <calcite-chip slot="content-end" icon="star-f"
      >Solved <b>{{ solvedCount() }} / {{ totalStars() }}</b></calcite-chip
    >
  </calcite-navigation>
  <calcite-panel slot="panel-top">
    <router-outlet />
  </calcite-panel>
</calcite-shell>
